name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -F "## [$VERSION]" CHANGELOG.md >/dev/null

      - name: Check tag ancestry
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test release artifacts
        env:
          DEVSENTRY_DIST_DIR: dist
          DEVSENTRY_EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          DEVSENTRY_EXPECTED_VERSION="${DEVSENTRY_EXPECTED_VERSION#v}" \
            tests/release_smoke_test.sh
