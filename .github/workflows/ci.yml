name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          OUT="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$OUT" ]; then
            echo "The following files are not formatted:"
            echo "$OUT"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -cover ./...
