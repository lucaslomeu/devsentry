version: 2

project_name: devsentry

builds:
  - id: devsentry
    main: .
    binary: devsentry
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X devsentry/cmd.Version={{.Version}}

archives:
  - formats: ["tar.gz"]
    ids:
      - devsentry
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: devsentry
    binaries:
      - devsentry
    repository:
      owner: lucaslomeu
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/lucaslomeu/devsentry"
    description: "CLI to inspect Docker resources and macOS environment status"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    skip_upload: auto

release:
  prerelease: auto

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\([[:alnum:]-]+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([[:alnum:]-]+\))?!?:'
      order: 1
    - title: Refactors
      regexp: '^refactor(\([[:alnum:]-]+\))?!?:'
      order: 2
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
