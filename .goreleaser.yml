version: 2

project_name: devsentry

builds:
  - id: devsentry
    main: .
    binary: devsentry
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X devsentry/cmd.Version={{.Version}}

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\([[:alnum:]-]+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([[:alnum:]-]+\))?!?:'
      order: 1
    - title: Refactors
      regexp: '^refactor(\([[:alnum:]-]+\))?!?:'
      order: 2
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
